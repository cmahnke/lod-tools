name: Build HDT WASM Artifact

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      hdt_version:
        description: 'Upstream HDT tag to build (e.g. 0.7.3). Leave empty to build all tags >= MIN_VERSION'
        required: false
        default: ''
        type: string
      skip_publish:
        description: 'Skip npm and GitHub Packages publishing (build-only test)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      hdt_version:
        description: 'Upstream HDT tag to build'
        required: false
        default: ''
        type: string
      skip_publish:
        description: 'Skip npm and GitHub Packages publishing'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  BINARYEN_VERSION: version_129
  MIN_VERSION: 0.6.0
  NPM_PACKAGE: '@projektemacher/hdt'
  GPR_PACKAGE: '@cmahnke/hdt'

jobs:
  discover:
    name: Discover versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
      latest: ${{ steps.set_matrix.outputs.latest }}
      has_versions: ${{ steps.set_matrix.outputs.has_versions }}
    steps:
      - name: Determine version list
        id: set_matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT="${{ inputs.hdt_version }}"
          EVENT="${{ github.event_name }}"

          TAGS=$(gh api repos/KonradHoeffner/hdt/tags --paginate \
            --jq '[.[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | .name]' 2>/dev/null || echo '[]')
          FILTERED=$(echo "$TAGS" | jq -c --arg min "$MIN_VERSION" \
            '[.[] | select((. | split(".") | map(tonumber)) >= ($min | split(".") | map(tonumber)))] | sort_by(split(".") | map(tonumber)) | reverse')
          COUNT=$(echo "$FILTERED" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "No versions >= $MIN_VERSION found"
            echo "matrix={\"hdt_version\":[]}" >> "$GITHUB_OUTPUT"
            echo "latest=" >> "$GITHUB_OUTPUT"
            echo "has_versions=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_versions=true" >> "$GITHUB_OUTPUT"
          LATEST=$(echo "$FILTERED" | jq -r '.[0]')

          if [ -n "$INPUT" ]; then
            VER="${INPUT#v}"
            echo "matrix={\"hdt_version\":[\"$VER\"]}" >> "$GITHUB_OUTPUT"
            echo "latest=$VER" >> "$GITHUB_OUTPUT"
            echo "Building single version: $VER"
          elif [ "$EVENT" = "push" ] || [ "$EVENT" = "pull_request" ]; then
            echo "matrix={\"hdt_version\":[\"$LATEST\"]}" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Push/PR: building latest version $LATEST"
          else
            echo "matrix={\"hdt_version\":$(echo "$FILTERED" | jq -c '.')}" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
            echo "Backfill: building all versions $(echo "$FILTERED" | jq -c '.')"
          fi

  build:
    name: Build WASM ${{ matrix.hdt_version }}
    needs: discover
    if: needs.discover.outputs.has_versions == 'true'
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    strategy:
      fail-fast: false
      matrix:
        hdt_version: ${{ fromJson(needs.discover.outputs.matrix).hdt_version }}

    steps:
      - name: Checkout hdt repository
        uses: actions/checkout@v7
        with:
          repository: KonradHoeffner/hdt
          ref: ${{ matrix.hdt_version }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install Binaryen
        run: |
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${{ env.BINARYEN_VERSION }}-x86_64-linux.tar.gz" \
            | tar -xz -C $HOME
          echo "$HOME/binaryen-${{ env.BINARYEN_VERSION }}/bin" >> $GITHUB_PATH

      - name: Verify Binaryen
        run: wasm-opt --version

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown-${{ matrix.hdt_version }}

      - name: Patch Cargo.toml for wasm32 uuid randomness
        run: |
          python3 - <<'PY'
          import re, io
          with open('Cargo.toml') as f:
              content = f.read()
          anchor = "[target.'cfg(target_arch = \"wasm32\")'.dependencies]"
          if re.search(r'^uuid\s*=\s*\{.*\}\s*$', content, re.M):
              print('uuid dependency already present, skipping')
          else:
              line = 'uuid = { version = "1", features = ["v4", "js"] }'
              if anchor in content:
                  content = content.replace(anchor + '\n', anchor + '\n' + line + '\n', 1)
              else:
                  content += '\n' + anchor + '\n' + line + '\n'
              with open('Cargo.toml', 'w') as f:
                  f.write(content)
              print('Added uuid wasm32 js feature to Cargo.toml')
          PY

      - name: Build WASM (web)
        run: wasm-pack build --target web --release --out-dir pkg/web
        env:
          RUSTFLAGS: '--cfg getrandom_backend="js"'

      - name: Build WASM (bundler)
        run: wasm-pack build --target bundler --release --out-dir pkg/bundler
        env:
          RUSTFLAGS: '--cfg getrandom_backend="js"'

      - name: List artifacts
        run: |
          echo "=== web ===" && ls -lh pkg/web/
          echo "=== bundler ===" && ls -lh pkg/bundler/

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: hdt-web-${{ matrix.hdt_version }}
          path: pkg/web/
          retention-days: 30

      - name: Upload bundler artifact
        uses: actions/upload-artifact@v7
        with:
          name: hdt-bundler-${{ matrix.hdt_version }}
          path: pkg/bundler/
          retention-days: 30

  publish-gpr:
    name: Publish to GitHub Packages ${{ matrix.hdt_version }}
    needs: [build, discover]
    if: ${{ needs.build.result == 'success' && inputs.skip_publish != true }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hdt_version: ${{ fromJson(needs.discover.outputs.matrix).hdt_version }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check if version exists on GPR
        id: check_gpr
        run: |
          if npm view "@cmahnke/hdt@${{ matrix.hdt_version }}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bundler artifact
        if: steps.check_gpr.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          name: hdt-bundler-${{ matrix.hdt_version }}
          path: pkg/

      - name: Setup Node.js
        if: steps.check_gpr.outputs.exists == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@cmahnke"

      - name: Prepare package for GitHub Packages
        if: steps.check_gpr.outputs.exists == 'false'
        run: |
          cd pkg
          jq '. + {
            name: "@cmahnke/hdt",
            repository: {
              type: "git",
              url: "https://github.com/KonradHoeffner/hdt.git"
            },
            publishConfig: {
              registry: "https://npm.pkg.github.com"
            }
          }' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "=== package.json ==="
          cat package.json

      - name: Publish
        if: steps.check_gpr.outputs.exists == 'false'
        run: |
          cd pkg
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm ${{ matrix.hdt_version }}
    needs: [build, discover]
    if: ${{ needs.build.result == 'success' && inputs.skip_publish != true }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hdt_version: ${{ fromJson(needs.discover.outputs.matrix).hdt_version }}

    permissions:
      contents: read

    steps:
      - name: Check if version exists on npm
        id: check_npm
        run: |
          if npm view "@projektemacher/hdt@${{ matrix.hdt_version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download bundler artifact
        if: steps.check_npm.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          name: hdt-bundler-${{ matrix.hdt_version }}
          path: pkg/

      - name: Setup Node.js
        if: steps.check_npm.outputs.exists == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Prepare package for npm
        if: steps.check_npm.outputs.exists == 'false'
        run: |
          cd pkg
          jq '. + {
            name: "@projektemacher/hdt",
            repository: {
              type: "git",
              url: "https://github.com/KonradHoeffner/hdt.git"
            },
            publishConfig: {
              registry: "https://registry.npmjs.org",
              access: "public"
            }
          }' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "=== package.json ==="
          cat package.json

      - name: Publish to npm
        if: steps.check_npm.outputs.exists == 'false'
        run: |
          cd pkg
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create release ${{ matrix.hdt_version }}
    needs: [build, publish-gpr, publish-npm, discover]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hdt_version: ${{ fromJson(needs.discover.outputs.matrix).hdt_version }}

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout (for git tag operations)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: hdt-web-${{ matrix.hdt_version }}
          path: artifacts/web/

      - name: Download bundler artifact
        uses: actions/download-artifact@v8
        with:
          name: hdt-bundler-${{ matrix.hdt_version }}
          path: artifacts/bundler/

      - name: Create tarballs from build artifacts
        run: |
          mkdir -p release
          tar czf release/hdt-web-${{ matrix.hdt_version }}.tar.gz -C artifacts/web .
          tar czf release/hdt-bundler-${{ matrix.hdt_version }}.tar.gz -C artifacts/bundler .
          echo "=== Release files ==="
          ls -lh release/

      - name: Check if versioned release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "hdt-${{ matrix.hdt_version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create versioned release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "hdt-${{ matrix.hdt_version }}" \
            release/hdt-web-${{ matrix.hdt_version }}.tar.gz \
            release/hdt-bundler-${{ matrix.hdt_version }}.tar.gz \
            --title "HDT WASM ${{ matrix.hdt_version }}" \
            --notes "**Automatic build of \`${{ github.sha }}\`** from upstream tag \`${{ matrix.hdt_version }}\`" \
            --latest=false

      - name: Delete existing 'latest' release and tag (only for latest version)
        if: matrix.hdt_version == needs.discover.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Create 'latest' tag (only for latest version)
        if: matrix.hdt_version == needs.discover.outputs.latest
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Create 'latest' release (only for latest version)
        if: matrix.hdt_version == needs.discover.outputs.latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            release/hdt-web-${{ matrix.hdt_version }}.tar.gz \
            release/hdt-bundler-${{ matrix.hdt_version }}.tar.gz \
            --title "Latest Build (v${{ matrix.hdt_version }})" \
            --notes "**Automatic build of \`${{ github.sha }}\`** from upstream tag \`${{ matrix.hdt_version }}\`" \
            --latest
